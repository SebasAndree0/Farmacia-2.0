<ion-header class="roles-header">
  <ion-toolbar class="topbar">
    <ion-title>Roles</ion-title>
  </ion-toolbar>

  <ion-toolbar class="searchbar-wrap">
    <ion-searchbar
      placeholder="Buscar admin, QF o cliente"
      [debounce]="600"
      animated
      (ionChange)="handleChange($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-grid fixed class="roles-grid">
    <ion-row>
      <ion-col
        size="12"
        size-md="6"
        size-lg="4"
        *ngFor="let detalles of results"
      >
        <ion-card class="role-card">
          <!-- Imagen / Avatar -->
          <div class="img-wrap">
            <img
              class="role-img"
              [src]="getPhoto(detalles)"
              [alt]="detalles.nombre"
              (error)="onImgError($event, detalles)"
            />

            <!-- Badge del rol -->
            <div class="badge" [ngClass]="badgeClass(detalles.tipo)">
              {{ detalles.tipo }}
            </div>
          </div>

          <!-- Info -->
          <ion-card-header class="role-head">
            <ion-card-title class="role-name">
              {{ detalles.nombre }}
            </ion-card-title>
            <p class="role-sub">Usuario del sistema</p>
          </ion-card-header>

          <!-- Acciones -->
          <ion-card-content class="actions">
            <ion-button
              expand="block"
              class="btn-danger"
              [routerLink]="['/eliminarUsuario', detalles.id]"
            >
              <ion-icon name="trash-outline" slot="start"></ion-icon>
              Eliminar
            </ion-button>

            <ion-button
              expand="block"
              class="btn-edit"
              [routerLink]="['/modificarUsuario', detalles.id]"
            >
              <ion-icon name="pencil-outline" slot="start"></ion-icon>
              Editar
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button [routerLink]="['/']">
          <ion-icon name="log-out-outline"></ion-icon>
          <ion-label>Salir</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
