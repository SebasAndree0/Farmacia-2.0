<ion-content class="app-bg" [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="page">
    <!-- HERO -->
    <div class="hero">
      <div class="toprow">
        <div>
          <h1>Perfumes</h1>
          <p>Busca por nombre, marca o categoría. Stock y precios al día.</p>
        </div>

        <ion-button fill="clear" class="back-btn" [routerLink]="['/producto']">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </ion-button>
      </div>

      <ion-searchbar
        mode="ios"
        placeholder="Buscar perfume, marca o categoría"
        [debounce]="250"
        animated
        (ionChange)="handleChange($event)">
      </ion-searchbar>

      <div class="hint-row">
        <span class="pill"><span class="dot"></span> Perfumes</span>
        <span class="pill"><span class="dot"></span> Hombre / Mujer / Unisex</span>
      </div>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty" *ngIf="resultados?.length === 0">
      <div class="empty-card">
        <div class="empty-icon">🌸</div>
        <div class="empty-title">No encontramos perfumes</div>
        <div class="empty-sub">Prueba con otro nombre, marca o categoría.</div>
      </div>
    </div>

    <!-- GRID DE PRODUCTOS -->
    <div class="grid" *ngIf="resultados?.length">
      <button
        class="p-card"
        *ngFor="let detalles of resultados"
        [routerLink]="['/detalle-perfumes', detalles.id]"
      >
        <div class="img-wrap">
          <img [src]="detalles.imagen" alt="" />
          <div class="badge">{{ detalles.categoria }}</div>
        </div>

        <div class="body">
          <div class="name">{{ detalles.nombre }} {{ detalles.marca }}</div>

          <div class="price">
            {{ detalles.precio | currency:'CLP' }}
          </div>

          <div class="actions">
            <span class="cta">
              Ver detalle
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </span>
          </div>
        </div>
      </button>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button [routerLink]="['/producto']">
          <ion-icon name="arrow-undo-outline"></ion-icon>
          <ion-label>Volver</ion-label>
        </ion-tab-button>

        <ion-tab-button [routerLink]="['/login']">
          <ion-icon name="person-circle" aria-hidden="true"></ion-icon>
          <ion-label>Usuario</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="openCart()">
          <ion-icon name="cart" class="cart-icon"></ion-icon>
          <ion-label>Carrito</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar>
</ion-footer>
