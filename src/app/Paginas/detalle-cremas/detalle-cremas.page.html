<ion-header class="glass-header">
  <ion-toolbar>
    <ion-title>Detalle Cremas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="detail-bg">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-fab vertical="top" horizontal="end" slot="fixed" class="fab-cart">
    <ion-fab-button (click)="openCart()">
      <ion-icon name="cart-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="wrap">
    <!-- LOADING / SKELETON -->
    <div class="loading" *ngIf="!productoActivo">
      <div class="skeleton-card">
        <div class="sk-img"></div>
        <div class="sk-line w70"></div>
        <div class="sk-line w45"></div>
        <div class="sk-line w85"></div>
      </div>
    </div>

    <!-- CARD -->
    <div *ngIf="productoActivo" class="card">
      <!-- HERO -->
      <div class="hero">
        <img [src]="productoActivo.imagen" alt="" loading="lazy" />

        <div class="meta">
          <span class="pill">{{ productoActivo.categoria }}</span>
          <span class="pill soft" *ngIf="productoActivo.marca">{{ productoActivo.marca }}</span>
        </div>
      </div>

      <!-- BODY -->
      <div class="content">
        <div class="top">
          <div class="name">{{ productoActivo.nombre }}</div>
          <div class="price">{{ productoActivo.precio | currency:'CLP' }}</div>
        </div>

        <div class="desc" *ngIf="productoActivo.detalle">
          {{ productoActivo.detalle }}
        </div>

        <div class="chips">
          <!-- Si NO usas receta en cremas, puedes borrar este chip -->
          <div class="chip" *ngIf="productoActivo.receta !== undefined && productoActivo.receta !== null">
            <ion-icon name="document-text-outline"></ion-icon>
            <span>Requiere receta</span>
          </div>

          <div class="chip" *ngIf="productoActivo.stock !== undefined && productoActivo.stock !== null">
            <ion-icon name="cube-outline"></ion-icon>
            <span>Stock: {{ productoActivo.stock }}</span>
          </div>
        </div>

        <ion-button
          expand="block"
          size="large"
          class="btn-primary"
          (click)="addToCart(productoActivo.nombre, productoActivo.precio, productoActivo.imagen, productoActivo.cantidad, productoActivo.stock)"
        >
          <ion-icon name="bag-add-outline" slot="start"></ion-icon>
          Agregar al carro
        </ion-button>

        <ion-button expand="block" fill="clear" class="btn-ghost" [routerLink]="['/cremas']">
          <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
          Volver
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="glass-footer">
  <ion-toolbar>
    <div class="footer-actions">
      <ion-button fill="clear" class="foot-btn" [routerLink]="['/cremas']">
        <ion-icon name="arrow-undo-outline" slot="start"></ion-icon>
        Volver
      </ion-button>

      <ion-button fill="clear" class="foot-btn" [routerLink]="['/login']">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        Usuario
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
